name: Lightweight CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve production dependencies without installing
        run: python -m pip install --dry-run --ignore-installed --disable-pip-version-check -r requirements.txt

      - name: Install lightweight lint tool
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Compile project Python files
        run: python -m compileall -q src tests scripts

      - name: Run dependency-free regression tests
        run: python -m unittest discover -s tests -v

      - name: Check lint
        run: ruff check src tests scripts

      - name: Check formatting
        run: ruff format --check src tests scripts
